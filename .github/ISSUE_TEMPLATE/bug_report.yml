name: Bug report
description: Something does not work as expected
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in the sections below — the
        version and QEMU build are usually the fastest way to reproduce it.
  - type: input
    id: version
    attributes:
      label: Easy QEMU version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: qemu
    attributes:
      label: QEMU version
      placeholder: "qemu-system-x86_64 8.2.1"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: qemu-log
    attributes:
      label: QEMU log of the affected VM
      description: |
        The log is written next to the VM record as <id>.log. Paste the
        relevant part — it usually contains the real error.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
